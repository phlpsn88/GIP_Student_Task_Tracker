<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Donkere Kalender</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="calendar">
  <div class="header">
    <button class="nav-btn prev" onclick="prevMonth()">&#8249;</button>
    <div class="month-year"></div>
    <button class="nav-btn next" onclick="nextMonth()">&#8250;</button>
  </div>

  <div class="weekdays">
    <div>Zo</div><div>Ma</div><div>Di</div><div>Wo</div>
    <div>Do</div><div>Vr</div><div>Za</div>
  </div>

  <div class="days" id="days"></div>
</div>

<script src="script.js"></script>
</body>
</html>
